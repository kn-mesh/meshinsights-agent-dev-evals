name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mi-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mi-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run basedpyright
      - run: uv run pytest

  agent-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run ruff check src/
      - run: uv run basedpyright
