schema_version: 1
source_pipeline: ../pipeline_configs/v1_3.ppln

model_policy:
  default_model: azure:gpt-5.6-luna
  default_reasoning_effort: medium
  permitted_overrides:
    models:
      - anthropic:claude-haiku-4-5
      - anthropic:claude-sonnet-4-5
      - anthropic:claude-sonnet-4-6
      - anthropic:claude-opus-4-5
      - anthropic:claude-opus-4-6
      - google:gemini-3.1-flash-lite-preview
      - google:gemini-3.5-flash
      - google:gemini-3.6-flash
      - google:gemini-3.1-flash-lite
      - openrouter:google/gemini-3.5-flash
      - azure:claude-haiku-4-5
      - azure:claude-sonnet-4-5
      - azure:claude-sonnet-4-6
      - azure:claude-opus-4-5
      - azure:claude-opus-4-6
      - azure:gpt-5.6-luna
      - azure:gpt-5.6-terra
      - azure:gpt-5.6-sol
    reasoning_efforts: [low, medium, high]

contracts:
  structured_input:
    metadata_type: BenchmarkExamplePipelineMetadata
    unit_identity: unit
    decision_timestamp: decision_timestamp
  structured_output:
    schema: PulseFailureAnalysisResult
    receipt_path: act.metadata.agent_output
  action_policy:
    external_side_effect: false
    terminal_action: NoOpAction
  evidence_recipe:
    source: immutable_azure_benchmark_snapshot
    required_artifact_kinds: [telemetry, alarms]
    lookback_days: 365

non_execution_exclusions:
  - docs/**
  - tests/**
  - eval_results/**
  - src/evals/**
  - src/benchmarks/**
  - src/agent_versions/**
  - src/lifecycle/**
  - src/apps/**
  - src/evidence/**
  - src/storage/hosted_azure_config.py
