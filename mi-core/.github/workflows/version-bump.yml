name: Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # Only run when the PR was merged and explicitly labeled with a bump type.
    if: github.event.pull_request.merged == true && (contains(github.event.pull_request.labels.*.name, 'major') || contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'patch'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # pull_request events check out the merge commit (detached HEAD), not the branch.
          # Explicitly check out main so we can commit and push back to it.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Determine bump type from PR labels
        id: bump-type
        run: |
          LABELS='${{ join(github.event.pull_request.labels.*.name, ',') }}'
          if echo "$LABELS" | grep -qi "major"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi "minor"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -qi "patch"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "No version label found; exiting" >&2
            exit 1
          fi
          echo "Bump type: $(grep type "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Bump versions
        id: bump
        run: |
          OUTPUT=$(uv run scripts/bump_versions.py bump ${{ steps.bump-type.outputs.type }})
          echo "$OUTPUT"
          # Extract the new version from the script output
          NEW_VERSION=$(echo "$OUTPUT" | grep '^NEW_VERSION=' | cut -d= -f2)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m ""
          git push origin main --follow-tags

  release:
    needs: bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "v${{ needs.bump.outputs.version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Extract changelog entry
        run: |
          uv run scripts/changelog.py extract ${{ needs.bump.outputs.version }} > release_body.md

      - name: Create GitHub Release
        run: |
          gh release create "v${{ needs.bump.outputs.version }}" \
            --title "v${{ needs.bump.outputs.version }}" \
            --notes-file release_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
