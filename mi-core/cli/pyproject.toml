[project]
name = "meshinsights-cli"
version = "0.5.2"
description = "CLI entry point for MeshInsights Data Pipeline"
authors = [
    { name = "Ethan Zeronik", email = "ethan.zeronik@meshsystems.com" }
]
requires-python = "==3.13.5"
dependencies = [
    "mi-core==0.5.2",
    "typer>=0.12.5",
    "pyfiglet>=1.0",
    "textual>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mi = "cli:main"
meshinsights = "cli:main"
mi-cli = "cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*"]
exclude = ["*.egg-info*", "__pycache__*", "*.pyc"]

[tool.setuptools.package-data]
"cli.ui" = ["monitor.css"]

[tool.uv]
package = true
