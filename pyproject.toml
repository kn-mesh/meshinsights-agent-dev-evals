[project]
name = "mesh.insights.template"
version = "0.3.0"
description = "Mesh Insights Template"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "mi-core[ai]",
    "pandas==2.3.3",
    "pandas-stubs>=2.3.3.251201",
    "plotly==6.5.0",
    "streamlit>=1.49.1",
    "logfire>=4.22.0",
    "python-dotenv>=1.0.1",
    "pydantic-ai>=2.11.0",
    "matplotlib>=3.10.8",
    "azure-storage-blob>=12.28.0",
    "psycopg[binary]>=3.2.0",
]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.32.1",
    "meshinsights-cli",
]

[tool.uv.sources]
mi-core = { path = "mi-core/core", editable = true }
meshinsights-cli = { path = "mi-core/cli", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # Ignore pytz internal use of deprecated utcfromtimestamp on Python 3.12+
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:pytz(\\..*)?$",
]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.meshinsights-pipeline]
scan_paths = ["src/**/*.py"]
exclude_paths = ["**/tests/**", ".venv/**"]
auto_scan = true
